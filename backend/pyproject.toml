[project]
name = "scenic-guide-backend"
version = "0.1.0"
description = "景区导览服务AI数字人 - 后端服务"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pypinyin>=0.51.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "sse-starlette>=2.0.0",
    "sqlite-vec>=0.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
